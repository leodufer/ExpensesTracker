name: Build

on:
  push:
    branches:
      - main


jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.
          cache: 'gradle'
      - name: Fix Java truststore
        run: |
          CACERTS="$JAVA_HOME/lib/security/cacerts"
          echo "Checking truststore at: $CACERTS"
          if [ -f "$CACERTS" ]; then
            echo "Truststore found, listing certs..."
            $JAVA_HOME/bin/keytool -list -cacerts -storepass changeit | head -20
          else
            echo "Truststore not found, recreating..."
            $JAVA_HOME/bin/keytool -genkey -alias self-signed -keyalg RSA -keysize 2048 -validity 365 -keystore "$CACERTS" -storepass changeit -noprompt -dname "CN=localhost"
          fi
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: ./gradlew build sonar --info
